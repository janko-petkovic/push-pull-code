[project]
name = "rdn"
version = "0.0.1"
authors = [
  { name="Janko Petkovic", email="petkojan@uni-bonn.de" },
]
description = "Modules used for the code in 'push-and-pull' paper."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ipykernel",
    "fides",
    "matplotlib",
    "pypesto==0.4.2",
    "torch",
    "statsmodels",
    "scikit_posthocs",
    "palettable",
    "scikit-image",
    "marimo>=0.23.16",
    "jax>=0.10.2",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>0.11.23, <0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
]
dev_gpu = [
  {include-group = "dev"},
  {include-group = "gpu"},
]

lint = [ "ruff>=0.16.1", ]
test = [ "pytest", ]
gpu = [
    "jax[cuda13]>=0.10.2",
]

[project.urls]
"Homepage" = "https://github.com/janko-petkovic/push-pull-code"

[tool.ruff]
line-length = 79
format.skip-magic-trailing-comma = true
lint.isort.split-on-trailing-comma = false
